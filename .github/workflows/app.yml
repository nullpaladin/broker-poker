name: app

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-app.txt bandit pip-audit
      - run: python -m pytest -q
      - run: bandit -q -r app --exclude app/tests -ll
      - run: pip-audit -r requirements-app.txt
